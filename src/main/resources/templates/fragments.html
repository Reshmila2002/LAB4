<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="fields">
    <div class="field">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" th:field="*{fullName}" placeholder="e.g. Nimal Perera">
        <small class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small>
    </div>

    <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" placeholder="nimal@example.com">
        <small class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
    </div>

    <div class="field">
        <label for="phone">Phone (10 digits)</label>
        <input type="text" id="phone" th:field="*{phone}" placeholder="0771234567">
        <small class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></small>
    </div>

    <div class="field">
        <label for="course">Course</label>
        <select id="course" th:field="*{course}">
            <option value="">-- Select a course --</option>
            <option th:each="courseOption : ${courses}" th:value="${courseOption}" th:text="${courseOption}"></option>
        </select>
        <small class="error" th:if="${#fields.hasErrors('course')}" th:errors="*{course}"></small>
    </div>

    <div class="field">
        <label for="age">Age</label>
        <input type="number" id="age" th:field="*{age}" placeholder="21" min="15" max="100">
        <small class="error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></small>
    </div>
</div>

</body>
</html>
