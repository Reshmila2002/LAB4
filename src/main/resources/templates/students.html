<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Registration System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <h1>Student Registration System</h1>
    <p>Spring Boot &middot; Thymeleaf &middot; H2 Database</p>
</header>

<main class="container">
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert danger" th:if="${error}" th:text="${error}"></div>

    <section class="card">
        <h2>Register a Student</h2>
        <form th:action="@{/students}" th:object="${student}" method="post" novalidate>
            <div th:replace="~{fragments :: fields}"></div>
            <button type="submit" class="btn primary">Save Student</button>
        </form>
    </section>

    <section class="card">
        <h2>Registered Students <span class="badge" th:text="${#lists.size(students)}">0</span></h2>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Course</th>
                    <th>Age</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="7" class="empty">No students registered yet.</td>
                </tr>
                <tr th:each="listedStudent : ${students}">
                    <td th:text="${listedStudent.id}"></td>
                    <td th:text="${listedStudent.fullName}"></td>
                    <td th:text="${listedStudent.email}"></td>
                    <td th:text="${listedStudent.phone}"></td>
                    <td th:text="${listedStudent.course}"></td>
                    <td th:text="${listedStudent.age}"></td>
                    <td class="actions">
                        <a class="btn small" th:href="@{/students/{id}/edit(id=${listedStudent.id})}">Edit</a>
                        <form th:action="@{/students/{id}/delete(id=${listedStudent.id})}" method="post"
                              onsubmit="return confirm('Delete this student?');">
                            <button type="submit" class="btn small danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer class="footer">COSC 32133 / BECS 32263 &middot; Lab Sheet 04</footer>
</body>
</html>
